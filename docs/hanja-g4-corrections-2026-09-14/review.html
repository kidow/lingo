<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>冊·灰·姉 보정 경로 대조</title>
<style>body{margin:24px;background:#faf7f2;color:#222;font:15px system-ui}h1{font-size:24px}button{padding:9px 14px;margin-right:8px}button[aria-pressed=true]{background:#222;color:white}.grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}.cell{background:white;border:1px solid #ddd;border-radius:8px;padding:8px}.cell svg{width:100%;height:135px}section{margin:20px 0}#player{width:180px;height:180px}.playback{display:flex;align-items:center;gap:16px}.caption{font-size:12px}a{color:#365b98}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<h1>冊·灰·姉 보정 경로 대조</h1><p>회색: 이전 획 · 보라: 현재 획 · 초록: 시작 · 빨강: 끝. 사전 원본은 링크로 별도 대조합니다.</p>
<nav aria-label="한자 선택"></nav><div class="playback"><svg id="player" viewBox="0 0 100 100" aria-label="보정 경로 재생"></svg><div><button id="replay">다시 재생</button><output id="progress"></output></div></div><main></main>
<script type="module">
const current=(await(await fetch('./candidate-paths.json')).json()).entries;
const previous=(await(await fetch('../hanja-g4-chaek-hoe-ja-2026-09-14/candidate-paths.json')).json()).entries;
const sources=(await(await fetch('../hanja-g4-held-11-2026-09-14/sources.json')).json()).entries;
const ns='http://www.w3.org/2000/svg';let selected=current[0],generation=0;
function pathElement(path,color){const element=document.createElementNS(ns,'path');for(const [key,value] of Object.entries({d:path,fill:'none',stroke:color,'stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'}))element.setAttribute(key,value);return element;}
async function replay(){const run=++generation;const player=document.querySelector('#player');player.replaceChildren();const paths=selected.paths;for(let i=0;i<paths.length;i++){if(run!==generation)return;const path=pathElement(paths[i],'#6660dc');player.append(path);const length=path.getTotalLength();path.style.strokeDasharray=length;path.style.strokeDashoffset=length;document.querySelector('#progress').textContent=`${i+1} / ${paths.length}`;await path.animate([{strokeDashoffset:length},{strokeDashoffset:0}],{duration:550,easing:'linear',fill:'forwards'}).finished;if(run!==generation)return;path.style.strokeDashoffset=0;}}
function render(entry){selected=entry;document.querySelectorAll('nav button').forEach(button=>button.setAttribute('aria-pressed',String(button.textContent===entry.glyph)));const main=document.querySelector('main');main.replaceChildren();for(const [label,paths] of [['보정 전',previous.find(item=>item.glyph===entry.glyph).paths],['보정 후',entry.paths]]){const section=document.createElement('section');const heading=document.createElement('h2');heading.textContent=`${entry.glyph} · ${label}`;section.append(heading);const link=document.createElement('a');link.textContent='사전 원본';link.href=sources.find(item=>item.glyph===entry.glyph).sourceUrl;link.target='_blank';link.rel='noopener';section.append(link);const grid=document.createElement('div');grid.className='grid';paths.forEach((path,i)=>{const cell=document.createElement('div');cell.className='cell';const caption=document.createElement('div');caption.className='caption';caption.textContent=`${i+1}획`;const svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('aria-label',`${entry.glyph} ${label} ${i+1}획`);paths.slice(0,i+1).forEach((p,j)=>svg.append(pathElement(p,j===i?'#6660dc':'#d3d0c9')));const pts=Array.from(path.matchAll(/[ML]([-.\d]+) ([-.\d]+)/g),m=>[+m[1],+m[2]]);for(const [point,color] of [[pts[0],'#138d57'],[pts.at(-1),'#d83939']]){const dot=document.createElementNS(ns,'circle');dot.setAttribute('cx',point[0]);dot.setAttribute('cy',point[1]);dot.setAttribute('r',1.5);dot.setAttribute('fill',color);svg.append(dot);}cell.append(caption,svg);grid.append(cell);});section.append(grid);main.append(section);}replay();}
document.querySelector('#replay').onclick=replay;for(const entry of current){const button=document.createElement('button');button.textContent=entry.glyph;button.onclick=()=>render(entry);document.querySelector('nav').append(button);}render(selected);
</script></html>
