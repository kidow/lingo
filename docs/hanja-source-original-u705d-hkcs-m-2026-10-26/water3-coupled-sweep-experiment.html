function play(){stop();frames=0;running=true;const start=performance.now();const tick=now=>{frames++;show(Math.min(1,(now-start)/C.naturalDurationMs));if(current<1&&errors.length===0)raf=requestAnimationFrame(tick);else{running=false;raf=0;report({naturalEnded:current===1})}};raf=requestAnimationFrame(tick)}
const controls=document.querySelector('#candidate-controls'),button=(label,fn)=>{const b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);controls.append(b)};for(const p of[0,1e-6,.01,.03,.05,.1,.25,.5,.75,.9,.99,1])button('후보 '+p,()=>{stop();show(p)});button('후보 자연 재생',play);button('후보 정지',stop);for(const p of[.05,.25,.5,.75,1])button('나란히 '+p,()=>{const b=document.querySelector('[data-fraction="'+p+'"]');if(b)b.click();stop();show(p)});button('kernel 시작 직전',()=>{stop();show((C.bodyStart-C.lo)/(C.hi-C.lo+C.bodyWeight)-1e-8)});button('kernel 시작',()=>{stop();show((C.bodyStart-C.lo)/(C.hi-C.lo+C.bodyWeight))});button('kernel 시작 직후',()=>{stop();show((C.bodyStart-C.lo)/(C.hi-C.lo+C.bodyWeight)+1e-8)});button('kernel 완료',()=>{stop();show((C.bodyEnd-C.lo+C.bodyWeight)/(C.hi-C.lo+C.bodyWeight))});show(0);
