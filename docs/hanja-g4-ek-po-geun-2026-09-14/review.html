<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>液·砲·筋 33획 검토</title>
<style>body{margin:12px;background:#faf7f2;color:#211f1b;font:14px system-ui}h1{font-size:20px;margin:0 0 8px}button{padding:7px 15px;margin-right:6px}button[aria-pressed=true]{background:#262421;color:white}nav{display:inline}header{margin:8px 0}#status{margin-left:14px}table{border-collapse:collapse;width:100%;max-width:1200px}th{font-weight:500}td{border:1px solid #ddd;background:white;text-align:center;height:177px}td:first-child{width:50px}iframe{width:170px;height:177px;border:0}svg.candidate{width:170px;height:170px}a{color:#555}#error{color:#a00}</style>
<h1>液·砲·筋 33획 검토</h1><nav id="glyphs"></nav><nav id="groups"></nav><button id="overview">보정 후보 전체</button><span id="status"></span>
<header>사전 원본 20% → 80% → 완료 · 후보: 회색 이전 획 / 보라 현재 획 / 초록 시작 / 빨강 끝. <a id="source" target="_blank">원본</a></header>
<div id="error"></div><table><thead><tr><th>획</th><th>사전 20%</th><th>사전 80%</th><th>사전 완료</th><th>후보 누적 상태</th></tr></thead><tbody id="rows"></tbody></table>
<script type="module">
const $=s=>document.querySelector(s),ns='http://www.w3.org/2000/svg';
const [candidates,sources]=await Promise.all(['candidate-paths.json','sources.json'].map(p=>fetch(p).then(r=>r.json())));
let glyph='液',group=0,generation=0;
const el=(tag,attrs={})=>{const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n};
function candidate(paths,index){const svg=el('svg',{viewBox:'0 0 100 100',class:'candidate',role:'img','aria-label':`${glyph} 후보 ${index+1}획`});paths.slice(0,index+1).forEach((d,i)=>svg.append(el('path',{d,fill:'none',stroke:i===index?'#7668cc':'#d3d3cc','stroke-width':5,'stroke-linecap':'round','stroke-linejoin':'round'})));const pts=[...paths[index].matchAll(/[ML]([-.\d]+) ([-.\d]+)/g)];for(const [p,color]of [[pts[0],'#16966d'],[pts.at(-1),'#d34444']])svg.append(el('circle',{cx:p[1],cy:p[2],r:1.5,fill:color}));return svg}
async function seek(frame,time,token){frame.contentWindow.postMessage({request:'once'},location.origin);frame.contentWindow.postMessage({request:'play'},location.origin);for(let tries=0;tries<180;tries++){if(token!==generation)return;const doc=frame.contentDocument;const animations=doc?.getAnimations?.()??[];if(animations.length){animations.forEach(a=>{a.pause();a.currentTime=time});await new Promise(requestAnimationFrame);frame.dataset.time=String(time);frame.dataset.animations=String(animations.length);return}await new Promise(requestAnimationFrame)}throw Error('원본 애니메이션을 시간에 맞춰 정지하지 못했습니다.')}
function render(){const token=++generation,s=sources.find(e=>e.glyph===glyph),c=candidates.entries.find(e=>e.glyph===glyph);$('#source').href=s.sourceUrl;$('#status').textContent='준비 중';$('#error').textContent='';$('#rows').replaceChildren();$('#glyphs').replaceChildren();$('#groups').replaceChildren();for(const g of candidates.entries.map(e=>e.glyph)){const b=document.createElement('button');b.textContent=g;b.setAttribute('aria-pressed',String(g===glyph));b.onclick=()=>{glyph=g;group=0;render()};$('#glyphs').append(b)}for(let i=0;i<Math.ceil(c.paths.length/3);i++){const b=document.createElement('button');b.textContent=`${i*3+1}–${Math.min(i*3+3,c.paths.length)}획`;b.setAttribute('aria-pressed',String(i===group));b.onclick=()=>{group=i;render()};$('#groups').append(b)}const batch=s.timingRows.slice(group*3,group*3+3);let ready=0;for(const row of batch){const [n,delay,duration]=row,tr=document.createElement('tr'),label=document.createElement('td');label.textContent=n+'획';tr.append(label);for(const fraction of [.2,.8,1]){const td=document.createElement('td'),frame=document.createElement('iframe');frame.title=`${glyph} ${n}획 ${fraction*100}%`;frame.onload=async()=>{try{await seek(frame,delay+duration*fraction,token);if(token===generation)$('#status').textContent=`${++ready}/${batch.length*3} 준비됨`}catch(e){$('#error').textContent=e.message}};frame.src=new URL(s.sourceUrl).pathname.replace('/hanjaSvg/aniSVG/','/')+`?stroke=${n}&phase=${fraction}`;td.append(frame);tr.append(td)}const td=document.createElement('td');td.append(candidate(c.paths,n-1));tr.append(td);$('#rows').append(tr)}}
$('#overview').onclick=()=>{generation++;$('#rows').replaceChildren();$('#error').textContent='';const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;const grid=document.createElement('div');grid.style='display:grid;grid-template-columns:repeat(6,1fr);gap:8px';const c=candidates.entries.find(e=>e.glyph===glyph);c.paths.forEach((_,i)=>{const item=document.createElement('div'),label=document.createElement('div');label.textContent=`${glyph} ${i+1}획`;item.append(label,candidate(c.paths,i));grid.append(item)});td.append(grid);tr.append(td);$('#rows').append(tr);$('#status').textContent=`보정 후보 ${c.paths.length}개 누적 상태`};
render();
</script></html>
