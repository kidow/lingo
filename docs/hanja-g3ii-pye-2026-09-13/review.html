<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>弊 14획 경로·방향 검토</title>
<style>body{font:16px system-ui;margin:24px;background:#faf8f3;color:#25231f}button,select{padding:10px 16px;font:inherit}header{display:flex;gap:12px;align-items:center}h1{font-size:24px}.panels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.panel{background:white;border:1px solid #ddd;padding:10px}iframe,svg{width:100%;height:310px;border:0}path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:5}#whole{width:390px;height:390px}#times{font-variant-numeric:tabular-nums}a{color:#51439b}</style>
<header><h1>弊 · 14획</h1><button id="previous">이전 획</button><select id="stroke" aria-label="획 선택"></select><button id="next">다음 획</button></header>
<p>사전 원문을 로컬 검토 서버에서 불러와 각 획의 20%·80%·완료 시점에 정지합니다. 후보의 초록 점은 시작, 빨강 점은 끝입니다.</p><p id="times"></p>
<main class="panels"><section class="panel"><h2>원문 20%</h2><iframe id="early" title="원문 20%"></iframe></section><section class="panel"><h2>원문 80%</h2><iframe id="late" title="원문 80%"></iframe></section><section class="panel"><h2>원문 완료</h2><iframe id="end" title="원문 완료"></iframe></section><section class="panel"><h2>후보 누적</h2><svg id="candidate" viewBox="0 0 100 100" aria-label="후보 누적"></svg></section></main>
<button id="replay">후보 재생</button><svg id="whole" viewBox="0 0 100 100" aria-label="후보 전체"></svg><p><a href="http://img.e-hanja.kr/hanjaSvg/aniSVG/5F00/5F0A.svg">사전 원문</a> · 외부 SVG 원본은 저장하거나 배포하지 않습니다.</p>
<script type="module">
const {entries:[entry]}=await fetch('./candidate-paths.json').then(r=>r.json()),paths=entry.paths;
const timings=[[500,500],[1200,440],[1840,607],[2647,1042],[3889,787],[4876,432],[5508,415],[6123,601],[6924,577],[7701,695],[8596,733],[9529,1148],[10877,703],[11780,625]];
const ns='http://www.w3.org/2000/svg',select=document.querySelector('#stroke');
timings.forEach((_,i)=>select.add(new Option(`${i+1}획`,String(i))));
function path(d,color){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('stroke',color);return p}
function render(target,count,markers){target.replaceChildren();paths.slice(0,count).forEach((d,i)=>target.append(path(d,i===count-1?'#6863d9':'#bbb')));if(markers){const points=[...paths[count-1].matchAll(/[ML]([-.\d]+) ([-.\d]+)/g)];[points[0],points.at(-1)].forEach((p,i)=>{const c=document.createElementNS(ns,'circle');c.setAttribute('cx',p[1]);c.setAttribute('cy',p[2]);c.setAttribute('r','1.4');c.setAttribute('fill',i?'#d83b32':'#169854');target.append(c)})}}
function show(){const n=Number(select.value),[begin,duration]=timings[n],fractions=[.2,.8,1.02];['early','late','end'].forEach((id,i)=>{const doc=document.getElementById(id).contentDocument;doc?.getAnimations().forEach(animation=>{animation.pause();animation.currentTime=begin+duration*fractions[i]})});document.querySelector('#times').textContent=`${n+1}획 · ${fractions.map(f=>((begin+duration*f)/1000).toFixed(3)+'초').join(' / ')}`;render(document.querySelector('#candidate'),n+1,true)}
for(const id of ['early','late','end']){const frame=document.getElementById(id);frame.onload=()=>{frame.contentWindow.postMessage({request:'once'},location.origin);frame.contentWindow.postMessage({request:'play'},location.origin);setTimeout(show,350)};frame.src='./source.svg'}
select.onchange=show;document.querySelector('#next').onclick=()=>{select.value=String(Math.min(13,Number(select.value)+1));show()};document.querySelector('#previous').onclick=()=>{select.value=String(Math.max(0,Number(select.value)-1));show()};
let animation;document.querySelector('#replay').onclick=()=>{cancelAnimationFrame(animation);const target=document.querySelector('#whole');target.replaceChildren();paths.forEach(d=>target.append(path(d,'#6863d9')));const elements=[...target.children],lengths=elements.map(p=>p.getTotalLength()),start=performance.now();function frame(now){const elapsed=now-start;elements.forEach((p,i)=>{p.style.strokeDasharray=String(lengths[i]);p.style.strokeDashoffset=String(lengths[i]*(1-Math.max(0,Math.min(1,(elapsed-i*550)/433))))});if(elapsed<paths.length*550)animation=requestAnimationFrame(frame)}animation=requestAnimationFrame(frame)};
render(document.querySelector('#whole'),14,false);show();
</script></html>
