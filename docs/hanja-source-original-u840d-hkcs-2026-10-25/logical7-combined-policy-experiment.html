function renderStage(phase,p,globalP=null){body.setAttribute('visibility','hidden');rise.setAttribute('visibility','hidden');try{validateWhole();ensure(fullOpaque(allInk)&&fullOpaque(target),'Opaque untransformed source P9 owner required');commitFoot(phase==='foot'?p:1);const footReport=JSON.parse(status.textContent);ensure(footReport.ready&&footReport.errors.length===0,'Source-bound foot correction failed');const state=bandState(phase,p);for(const[rect,y,h]of[[bodyRect,state.bodyY,state.bodyHeight],[riseRect,state.riseY,state.riseHeight]]){ensure(Number.isFinite(y)&&Number.isFinite(h)&&h>=0,'Invalid band');rect.setAttribute('y',String(y));rect.setAttribute('height',String(h))}body.setAttribute('visibility',state.bodyVisible?'visible':'hidden');rise.setAttribute('visibility',state.riseVisible?'visible':'hidden');if(phase!=='foot')ensure(fullOpaque(ink)&&[...ink.children].every(x=>x.getAttribute('visibility')!=='hidden'),'Actual completed source foot required');if(phase==='rise')ensure(state.bodyVisible&&state.bodyY<=CFG.cut&&state.bodyY+state.bodyHeight>=CFG.bodyBottom&&fullOpaque(body),'Actual completed lower body required for rise');validateWhole();const paint=target.innerHTML;let transitionEquality=null;if(phase==='foot'&&p===1)footEndPaint=paint;if(phase==='body'&&p===0&&footEndPaint!==null){transitionEquality={from:'foot1',to:'body0',sameActualDOMPaint:paint===footEndPaint};ensure(transitionEquality.sameActualDOMPaint,'Foot/body transition paint changed')}if(phase==='body'&&p===1)bodyEndPaint=paint;if(phase==='rise'&&p===0&&bodyEndPaint!==null){transitionEquality={from:'body1',to:'rise0',sameActualDOMPaint:paint===bodyEndPaint};ensure(transitionEquality.sameActualDOMPaint,'Body/rise transition paint changed')}if(naturalRunning&&(naturalTrace.length===0||naturalTrace[naturalTrace.length-1].phase!==phase))naturalTrace.push({phase,globalP,localP:p});status.textContent=JSON.stringify({ready:true,phase,localP:p,globalP,bandState:state,foot:{localP:phase==='foot'?p:1,L:footReport.L,d:footReport.d,rho:footReport.rho,point:footReport.point,p3Frontier:footReport.p3Frontier},clockBasis:'public UA foot-Q length + source body19.85 + rising36.3; not publisher clock',transitionEquality,natural:{running:naturalRunning,frames:naturalFrames,trace:naturalTrace,durationMs:CFG.reviewNaturalDurationMs},coordinateSpace:'normalized100',originalIndependentP9Unchanged:true,sourceQDataRetainedUnchanged:CFG.originalQData,originalRevealWidths:CFG.originalRevealWidths,bodyRisingProofSHA256:CFG.bodyRisingProofSHA256,logical7ReviewShapeComplete:phase==='rise'&&p===1,fullLogical7Approved:false,actualAppApproved:false,nativeApproval:false,runtimeApplied:false,errors},null,2);return true}catch(e){wholeReset();errors.push(String(e));status.textContent=JSON.stringify({ready:false,phase,p,errors});return false}}
function globalState(g,L){ensure(Number.isFinite(g)&&g>=0&&g<=1&&Number.isFinite(L)&&L>7,'Bounded review clock and original UA length required');if(g===1)return{phase:'rise',p:1};const down=CFG.bodyBottom-CFG.cut,up=CFG.riseBottom-CFG.top,total=L+down+up,d=g*total;if(d<L)return{phase:'foot',p:d/L};if(d<L+down)return{phase:'body',p:(d-L)/down};return{phase:'rise',p:(d-L-down)/up}}
function stopNatural(){naturalRunning=false;if(naturalRAF!==null)cancelAnimationFrame(naturalRAF);naturalRAF=null}
function playNatural(){stopNatural();naturalFrames=0;naturalTrace=[];const L=measure.getTotalLength(),started=performance.now();naturalRunning=true;if(!renderStage('foot',0,0)){stopNatural();return}function tick(now){const g=Math.min(1,Math.max(0,(now-started)/CFG.reviewNaturalDurationMs));naturalFrames++;const s=globalState(g,L);if(g===1)naturalRunning=false;if(!renderStage(s.phase,s.p,g)){stopNatural();return}if(g<1)naturalRAF=requestAnimationFrame(tick);else naturalRAF=null}naturalRAF=requestAnimationFrame(tick)}
document.querySelector('#controls').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;ensure(CFG.reviewActions.includes(a),'Unlisted review action');stopNatural();if(a==='natural'){playNatural();return}naturalTrace=[];naturalFrames=0;if(a==='start')renderStage('foot',0,0);else if(a==='epsilon'){const L=measure.getTotalLength(),s=globalState(0.000001,L);renderStage(s.phase,s.p,0.000001)}else if(a==='foot-end')renderStage('foot',1);else if(a==='body-start')renderStage('body',0);else if(a==='body-end')renderStage('body',1);else if(a==='rise-start')renderStage('rise',0);else if(a==='complete')renderStage('rise',1)});renderStage('foot',0,0);
</script></html>
