<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纘 1·2획 혼합 guide 유한 시안</title>
<style>body{margin:20px;font:16px/1.5 system-ui;color:#222;background:#faf9f6}h1{font-size:28px;margin:0 0 8px}p{margin:6px 0}button{padding:8px 12px;margin:4px;border:1px solid #bbb;background:white;border-radius:6px;font:inherit}input[type=range]{width:min(700px,90vw)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:20px}.panel{max-width:540px}svg{width:100%;max-width:520px;height:auto;background:#fff;border:1px solid #ddd}h2{font-size:22px;margin:14px 0 4px}.note{font-size:14px;color:#555}#error{color:#a00;white-space:pre-wrap}</style>
<h1>纘 1·2획: 원P 고정 · 혼합 저자 guide</h1><p>203개 유한 표본 시안입니다. 실제 R에 연결하지 않았고, 연속 노출은 미승인입니다.</p><p class="note">원62P는 바꾸지 않았습니다. 검증된 玄3/4의 연속 1M5L 전체를 공개 원P 교집합 seed·시작·끝에 양수 affine로 배치했습니다. 아래에는 각 획까지의 공개 원P만 확대합니다. 원 출판사 미세시간·필체 동일성은 주장하지 않습니다.</p>
<div><button id="play">유한 표본 재생</button><button id="stop">정지</button><span id="state"></span></div><input id="slider" type="range" min="0" max="202" value="125"><div id="presets"></div><p><label><input type="checkbox" id="guide">guide와 교집합 seed 표시</label></p><div class="grid" id="panels"></div><p id="error"></p>
<script type="module">
const EXPECTED_HASH="8a9bde108ea7ab839c172ad4d918daf2d7d96a85754f9366d29ca86441f70f89",EXPECTED_GEOMETRY="aa241350799c5b55d739505e9c873cf2e820b1f65f6ae0c428d79a4dc9575f0f",NS="http://www.w3.org/2000/svg";
const el=(name,attrs={})=>{const n=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))if(v!==null&&v!==undefined)n.setAttribute(k,String(v));return n};
try{
const response=await fetch('./prototype-data.json',{cache:'no-store'});if(!response.ok)throw Error('Public local prototype data missing');const text=await response.text(),hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))].map(v=>v.toString(16).padStart(2,'0')).join('');if(hash!==EXPECTED_HASH)throw Error('Frozen prototype data hash mismatch');const DATA=JSON.parse(text);if(DATA.sourceGeometrySHA256!==EXPECTED_GEOMETRY||DATA.sourcePCount!==62||DATA.actualR!==false||DATA.nativeApproval!==false||DATA.runtimeApplied!==false)throw Error('Prototype contract rejected');const frames=DATA.policies[0].frames,slider=document.querySelector('#slider');slider.max=frames.length-1;let index=frames.findIndex(f=>f.progress===.625),generation=0;slider.value=index;
function render(){const frame=frames[index];document.querySelector('#state').textContent='p='+frame.progress+' · 표본 '+(index+1)+'/'+frames.length;const panels=document.querySelector('#panels');panels.replaceChildren();for(const p of DATA.policies){const localFrame=p.frames[index],s=p.segment,section=document.createElement('section');section.className='panel';const h=document.createElement('h2');h.textContent=p.pen+'획 · 玄'+p.donorStroke+' guide';section.append(h);const svg=el('svg',{viewBox:p.viewBox.join(' '),width:520,height:520,'data-pen':p.pen,'data-progress':frame.progress});const defs=el('defs'),maskId='mask-'+p.pen,clipId='clip-'+p.pen;svg.append(defs);if(p.priorOutline)svg.append(el('path',{d:p.priorOutline,fill:'#222'}));if(frame.progress>0){const path=el('path',{d:s.outline,fill:'#222'});if(frame.progress<1){const mask=el('mask',{id:maskId,maskUnits:'userSpaceOnUse',maskContentUnits:'userSpaceOnUse',x:-100,y:-100,width:300,height:300});mask.append(el('path',{d:s.revealPath,fill:'none',stroke:'white','stroke-width':s.revealWidth,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1-frame.progress}));defs.append(mask);path.setAttribute('mask','url(#'+maskId+')');if(localFrame.clip){const clip=el('clipPath',{id:clipId,clipPathUnits:'userSpaceOnUse'});clip.append(el('path',{d:localFrame.clip}));defs.append(clip);path.setAttribute('clip-path','url(#'+clipId+')')}}svg.append(path)}if(document.querySelector('#guide').checked){svg.append(el('path',{d:s.revealPath,fill:'none',stroke:'#b66','stroke-width':.2}));const plan=DATA.math.plans.find(a=>a.logical===p.pen),seed=plan.recipientAnchorsExact100[1].map(v=>v.includes('/')?v.split('/').map(Number).reduce((a,b)=>a/b):Number(v));svg.append(el('circle',{cx:seed[0],cy:seed[1],r:.5,fill:'#39895a'}))}section.append(svg);const note=document.createElement('p');note.className='note';note.textContent=p.pen===1?'첫4개 edge DL → 마지막 DR. 원P5개, 두 원guide gap은 원문에 보존.':'첫3개 edge DL → 작은 우하향 corner → 오른쪽 상향H. corner ≈(0.4221,1.5192), 원P6개. 세부 방향·연결은 직접 확인해야 합니다.';section.append(note);panels.append(section)}window.__review={glyph:'纘',progress:frame.progress,frame:index,totalFrames:frames.length,dataSHA256:hash,sourceGeometrySHA256:EXPECTED_GEOMETRY,actualR:false,nativeApproval:false}}
slider.oninput=()=>{generation++;index=Number(slider.value);render()};document.querySelector('#guide').onchange=render;for(const progress of[0,1e-6,.01,.03,.1,.375,.5,.625,.75,.95,.99999999,1]){const b=document.createElement('button');b.textContent=String(progress);b.onclick=()=>{generation++;index=frames.findIndex(f=>f.progress===progress);slider.value=index;render()};document.querySelector('#presets').append(b)}document.querySelector('#stop').onclick=()=>generation++;document.querySelector('#play').onclick=()=>{const run=++generation;index=0;const step=()=>{if(run!==generation)return;slider.value=index;render();if(++index<frames.length)setTimeout(step,30)};step()};render();
}catch(e){document.querySelector('#error').textContent=String(e)}
</script></html>
