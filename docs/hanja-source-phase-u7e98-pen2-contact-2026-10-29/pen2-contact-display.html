<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纘2획 원P 접촉 phase 시안</title><style>body{margin:20px;font:16px/1.5 system-ui;color:#222;background:#faf9f6}h1{font-size:28px;margin:0 0 8px}p{max-width:800px;margin:6px 0}button{padding:8px 10px;margin:3px;font:inherit;border:1px solid #bbb;border-radius:5px;background:#fff}input[type=range]{width:min(700px,90vw)}svg{display:block;width:min(520px,95vw);height:auto;background:white;border:1px solid #ddd;margin-top:12px}.note{font-size:14px;color:#555}#error{color:#a00}</style>
<h1>纘2획 · 원DL → 접촉 head → 오른쪽H</h1><p>원3P DL은 기존 Q14/7·원JS 경계 그대로입니다. H3P는 완료된 DL과 겹치는 seed에서 왼 head를 먼저 채운 뒤 오른쪽으로 전개합니다.</p><p class="note">209개 유한 표본이며 실제 R이 아닙니다. 원62P 변경0, H 시계는 저자 phase입니다. 작성 방향을 왼쪽으로 바꾼다는 뜻이 아니며, 출판사 미세시간·모든 실수 시점의 화면 연결을 주장하지 않습니다.</p>
<button id="play">유한 표본 재생</button><button id="stop">정지</button><span id="state"></span><div><input type="range" id="slider" min="0" max="208"></div><div id="presets"></div><p><label><input type="checkbox" id="seed">접촉 seed 표시</label></p><div id="board"></div><p id="error"></p>
<script type="module">
const EXPECTED="b3acadbb28f385e2865c8c4072e2b6567b7263dc83a6b73593da11a2eaa9efdc",NS="http://www.w3.org/2000/svg";const el=(tag,attrs={})=>{const n=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))if(v!==null&&v!==undefined)n.setAttribute(k,String(v));return n};
try{const r=await fetch('./phase-display.json',{cache:'no-store'});if(!r.ok)throw Error('Frozen data missing');const text=await r.text(),hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(text)))].map(v=>v.toString(16).padStart(2,'0')).join('');if(hash!==EXPECTED)throw Error('Frozen data SHA mismatch');const D=JSON.parse(text);if(D.sourcePCount!==62||D.actualR!==false||D.nativeApproval!==false||D.phasePlan.DLend!==.5770868086377152)throw Error('Source phase contract rejected');let index=D.frames.findIndex(f=>f.progress===.5),generation=0;const slider=document.querySelector('#slider');slider.max=D.frames.length-1;slider.value=index;
function render(){const f=D.frames[index],svg=el('svg',{viewBox:D.viewBox.join(' '),width:520,height:520,'data-progress':f.progress,'data-phase':f.phase}),defs=el('defs');svg.append(defs);svg.append(el('path',{d:D.priorOutline,fill:'#222'}));if(f.baseDL)svg.append(el('path',{d:D.sourceDL.outline,fill:'#222'}));if(f.mode==='curve'){const mask=el('mask',{id:'curve-mask',maskUnits:'userSpaceOnUse',maskContentUnits:'userSpaceOnUse',x:-100,y:-100,width:300,height:300});mask.append(el('path',{d:D.sourceDL.revealPath,fill:'none',stroke:'white','stroke-width':14,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':1,'stroke-dashoffset':1-f.local}));defs.append(mask);const p=el('path',{d:D.sourceDL.outline,fill:'#222',mask:'url(#curve-mask)'});if(f.startClip){const c=el('clipPath',{id:'start-clip',clipPathUnits:'userSpaceOnUse'});c.append(el('path',{d:f.startClip}));defs.append(c);p.setAttribute('clip-path','url(#start-clip)')}svg.append(p)}else if(f.mode==='rect'){const c=el('clipPath',{id:'head-body-clip',clipPathUnits:'userSpaceOnUse'});c.append(el('rect',f.rect));defs.append(c);svg.append(el('path',{d:D.sourceH.outline,fill:'#222','clip-path':'url(#head-body-clip)'}))}else if(f.mode==='full')svg.append(el('path',{d:D.sourceH.outline,fill:'#222'}));if(document.querySelector('#seed').checked)svg.append(el('circle',{cx:D.phasePlan.seedX,cy:D.phasePlan.seedY,r:.4,fill:'#39895a'}));document.querySelector('#board').replaceChildren(svg);document.querySelector('#state').textContent='p='+f.progress+' · '+f.phase+' · '+(index+1)+'/'+D.frames.length;window.__review={glyph:'纘',pen:2,progress:f.progress,phase:f.phase,dataSHA256:hash,actualR:false,nativeApproval:false}}
slider.oninput=()=>{generation++;index=Number(slider.value);render()};document.querySelector('#seed').onchange=render;for(const p of[0,1e-6,.1,.375,.5,D.phasePlan.DLend-1e-8,D.phasePlan.DLend,D.phasePlan.DLend+1e-8,.625,D.phasePlan.leftHeadEnd-1e-8,D.phasePlan.leftHeadEnd,D.phasePlan.leftHeadEnd+1e-8,.95,.99999999,1]){const b=document.createElement('button');b.textContent=String(p);b.onclick=()=>{generation++;index=D.frames.findIndex(f=>f.progress===p);slider.value=index;render()};document.querySelector('#presets').append(b)}document.querySelector('#stop').onclick=()=>generation++;document.querySelector('#play').onclick=()=>{const g=++generation;index=0;const step=()=>{if(g!==generation)return;slider.value=index;render();if(++index<D.frames.length)setTimeout(step,30)};step()};render()
}catch(e){document.querySelector('#error').textContent=String(e)}
</script></html>
