function commitFoot(p){reset();try{ensure(Number.isFinite(p)&&p>=0&&p<=1,'bounded internal foot progress');validate();const L=measure.getTotalLength();ensure(Number.isFinite(L)&&L>7,'invalid original UA measured Q length');const d=p*L,point=measure.getPointAtLength(L-d),rho=Math.min(7,d);ensure(Number.isFinite(point.x)&&Number.isFinite(point.y),'invalid UA point');if(p===0)ensure(Math.hypot(point.x-CFG.qEnd[0],point.y-CFG.qEnd[1])<1e-4,'UA original Q end mismatch');guide.setAttribute('stroke-dasharray',String(p)+' 2');guide.setAttribute('stroke-dashoffset',String(p-1));start.setAttribute('cx',String(CFG.qEnd[0]));start.setAttribute('cy',String(CFG.qEnd[1]));start.setAttribute('r',String(rho));end.setAttribute('cx',String(point.x));end.setAttribute('cy',String(point.y));end.setAttribute('r',String(rho));validate();if(p>0)ink.setAttribute('visibility','visible');commitP3(p,point,rho);validate();status.textContent=JSON.stringify({ready:true,phase:CFG.phase,p,L,d,measurementDistance:L-d,rho,point:{x:point.x,y:point.y},dashoffset:p-1,p3Frontier:p3State,attachedFrontierProofSHA256:CFG.attachedFrontierProofSHA256,coordinateSpace:'normalized100',originalQUnchanged:true,originalP9IndependentReferenceUnchanged:true,targetScope:CFG.targetScope,targetPaintPathsSHA256:CFG.targetPaintPathsSHA256,revealWidth:14,sourceFixtureSHA256:CFG.sourceFixtureSHA256,preparedSourceUnitGeometrySHA256:CFG.preparedSourceUnitGeometrySHA256,paintPathsSHA256:CFG.paintPathsSHA256,paintMode:CFG.paintMode,sourceFull5SHA256:CFG.sourceFull5SHA256,p1MeansOnlyFootQFrontComplete:true,logical3Complete:false,nativeApproval:false,runtimeApplied:false,errors},null,2)}catch(e){reset();errors.push(String(e));status.textContent=JSON.stringify({ready:false,p,errors})}}
const allInk=document.querySelector('#all-ink'),body=document.querySelector('#body'),rise=document.querySelector('#rise'),bodyRect=document.querySelector('#body-rect'),riseRect=document.querySelector('#rise-rect');
let naturalRunning=false,naturalRAF=null,naturalFrames=0,naturalTrace=[],footEndPaint=null,bodyEndPaint=null;
function bandState(phase,p){ensure(Number.isFinite(p)&&p>=0&&p<=1,'Bounded local band progress required');if(phase==='foot')return{bodyY:CFG.cut,bodyHeight:0,bodyVisible:false,riseY:CFG.riseBottom,riseHeight:0,riseVisible:false};if(phase==='body')return{bodyY:CFG.cut,bodyHeight:(CFG.bodyBottom-CFG.cut)*p,bodyVisible:p>0,riseY:CFG.riseBottom,riseHeight:0,riseVisible:false};ensure(phase==='rise','Unknown review phase');const h=p===1?CFG.top:CFG.riseBottom-p*(CFG.riseBottom-CFG.top),by=Math.min(CFG.cut,h);return{bodyY:by,bodyHeight:CFG.bodyBottom-by,bodyVisible:true,riseY:h,riseHeight:CFG.riseBottom-h,riseVisible:p>0}}
function wholeReset(){reset();body.setAttribute('visibility','hidden');rise.setAttribute('visibility','hidden')}
function validateWhole(){validate();ensure(ink.parentElement===allInk&&body.parentElement===allInk&&rise.parentElement===allInk&&allInk.parentElement===target&&allInk.children.length===3,'Exact source P9 review tree required');const paths=[...allInk.querySelectorAll('path')];ensure(paths.length===9&&paths.every((p,i)=>p.getAttribute('d')===CFG.paintPaths[i].outline),'Original source independent P9 changed');ensure(ink.children.length===3&&body.children.length===4&&rise.children.length===2,'Original raw paint partition changed');for(const[id,rect]of[['body-band',bodyRect],['rise-band',riseRect]])ensure(rect.ownerSVGElement===target&&rect.parentElement.getAttribute('id')===id&&rect.parentElement.getAttribute('clipPathUnits')==='userSpaceOnUse'&&rect.getAttribute('x')==='0'&&rect.getAttribute('width')==='100','Exact band coordinate owner required');ensure(body.getAttribute('clip-path')==='url(#body-band)'&&rise.getAttribute('clip-path')==='url(#rise-band)','Exact source band clip changed')}
function fullOpaque(node){const s=getComputedStyle(node);return node.isConnected&&Number(s.opacity)===1&&Number(s.fillOpacity)===1&&s.visibility==='visible'&&s.display!=='none'&&s.transform==='none'&&s.filter==='none'}
function renderStage(phase,p,globalP=null){body.setAttribute('visibility','hidden');rise.setAttribute('visibility','hidden');try{validateWhole();ensure(fullOpaque(allInk)&&fullOpaque(target),'Opaque untransformed source P9 owner required');commitFoot(phase==='foot'?p:1);const footReport=JSON.parse(status.textContent);ensure(footReport.ready&&footReport.errors.length===0,'Source-bound foot correction failed');const state=bandState(phase,p);for(const[rect,y,h]of[[bodyRect,state.bodyY,state.bodyHeight],[riseRect,state.riseY,state.riseHeight]]){ensure(Number.isFinite(y)&&Number.isFinite(h)&&h>=0,'Invalid band');rect.setAttribute('y',String(y));rect.setAttribute('height',String(h))}body.setAttribute('visibility',state.bodyVisible?'visible':'hidden');rise.setAttribute('visibility',state.riseVisible?'visible':'hidden');if(phase!=='foot')ensure(fullOpaque(ink)&&[...ink.children].every(x=>x.getAttribute('visibility')!=='hidden'),'Actual completed source foot required');if(phase==='rise')ensure(state.bodyVisible&&state.bodyY<=CFG.cut&&state.bodyY+state.bodyHeight>=CFG.bodyBottom&&fullOpaque(body),'Actual completed lower body required for rise');validateWhole();const paint=target.innerHTML;let transitionEquality=null;if(phase==='foot'&&p===1)footEndPaint=paint;if(phase==='body'&&p===0&&footEndPaint!==null){transitionEquality={from:'foot1',to:'body0',sameActualDOMPaint:paint===footEndPaint};ensure(transitionEquality.sameActualDOMPaint,'Foot/body transition paint changed')}if(phase==='body'&&p===1)bodyEndPaint=paint;if(phase==='rise'&&p===0&&bodyEndPaint!==null){transitionEquality={from:'body1',to:'rise0',sameActualDOMPaint:paint===bodyEndPaint};ensure(transitionEquality.sameActualDOMPaint,'Body/rise transition paint changed')}if(naturalRunning&&(naturalTrace.length===0||naturalTrace[naturalTrace.length-1].phase!==phase))naturalTrace.push({phase,globalP,localP:p});status.textContent=JSON.stringify({ready:true,phase,localP:p,globalP,bandState:state,foot:{localP:phase==='foot'?p:1,L:footReport.L,d:footReport.d,rho:footReport.rho,point:footReport.point,p3Frontier:footReport.p3Frontier},clockBasis:'public UA foot-Q length + source body20.95 + rising46; not publisher clock',transitionEquality,natural:{running:naturalRunning,frames:naturalFrames,trace:naturalTrace,durationMs:CFG.reviewNaturalDurationMs},coordinateSpace:'normalized100',originalIndependentP9Unchanged:true,sourceQDataRetainedUnchanged:CFG.originalQData,originalRevealWidths:CFG.originalRevealWidths,bodyRisingProofSHA256:CFG.bodyRisingProofSHA256,logical3ReviewShapeComplete:phase==='rise'&&p===1,fullLogical3Approved:false,actualAppApproved:false,nativeApproval:false,runtimeApplied:false,errors},null,2);return true}catch(e){wholeReset();errors.push(String(e));status.textContent=JSON.stringify({ready:false,phase,p,errors});return false}}
function globalState(g,L){ensure(Number.isFinite(g)&&g>=0&&g<=1&&Number.isFinite(L)&&L>7,'Bounded review clock and original UA length required');if(g===1)return{phase:'rise',p:1};const down=CFG.bodyBottom-CFG.cut,up=CFG.riseBottom-CFG.top,total=L+down+up,d=g*total;if(d<L)return{phase:'foot',p:d/L};if(d<L+down)return{phase:'body',p:(d-L)/down};return{phase:'rise',p:(d-L-down)/up}}
function stopNatural(){naturalRunning=false;if(naturalRAF!==null)cancelAnimationFrame(naturalRAF);naturalRAF=null}
function playNatural(){stopNatural();naturalFrames=0;naturalTrace=[];const L=measure.getTotalLength(),started=performance.now();naturalRunning=true;if(!renderStage('foot',0,0)){stopNatural();return}function tick(now){const g=Math.min(1,Math.max(0,(now-started)/CFG.reviewNaturalDurationMs));naturalFrames++;const s=globalState(g,L);if(g===1)naturalRunning=false;if(!renderStage(s.phase,s.p,g)){stopNatural();return}if(g<1)naturalRAF=requestAnimationFrame(tick);else naturalRAF=null}naturalRAF=requestAnimationFrame(tick)}
document.querySelector('#controls').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;ensure(CFG.reviewActions.includes(a),'Unlisted review action');stopNatural();if(a==='natural'){playNatural();return}naturalTrace=[];naturalFrames=0;if(a==='start')renderStage('foot',0,0);else if(a==='epsilon'){const L=measure.getTotalLength(),s=globalState(0.000001,L);renderStage(s.phase,s.p,0.000001)}else if(a==='foot-end')renderStage('foot',1);else if(a==='body-start')renderStage('body',0);else if(a==='body-end')renderStage('body',1);else if(a==='rise-start')renderStage('rise',0);else if(a==='complete')renderStage('rise',1)});renderStage('foot',0,0);

document.querySelector('#local-controls').addEventListener('click',e=>{const b=e.target.closest('button[data-phase][data-local]');if(!b)return;const phase=b.dataset.phase,p=Number(b.dataset.local);ensure(CFG.localReviewStates.some(s=>s.phase===phase&&Object.is(s.p,p)),'Unlisted fixed local review state');stopNatural();naturalTrace=[];naturalFrames=0;renderStage(phase,p)});
</script></html>
